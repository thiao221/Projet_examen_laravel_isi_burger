version: '3.8'
services:
    app:
        build: .
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - db  # Doit correspondre exactement au nom ci-dessous

    db:
        image: postgres:15
        environment:
            POSTGRES_DB: isi_burger_db
            POSTGRES_USER: laravel_user
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
