version: '3.8'
services:
    # Le serveur Web (Ton code Laravel)
    app:
        build: .
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - db

    # La base de données PostgreSQL
    db:
        image: postgres:15
        environment:
            POSTGRES_DB: isi_burger_db
            POSTGRES_USER: laravel_user
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
